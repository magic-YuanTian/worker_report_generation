# Model reference for the Worker Daily Report Generator.
#
# Documentation only - this file is not read by the app. The real values
# live in the Python constants named below; keep this file in sync if
# those change.

rag:
  dialogue_llm:
    model: gpt-4o
    file: backend/conversation_manager.py
    constant: LLM_MODEL
    purpose: Drives the chat conversation and report field extraction.

  retrieval_relevance_judge:
    model: gpt-4o
    file: backend/rag_engine.py
    constant: LLM_MODEL
    purpose: Judges whether each retrieved chunk is relevant before it's included in chat context.

  embedding:
    model: text-embedding-3-large
    file: backend/rag_engine.py
    constant: EMBEDDING_MODEL
    purpose: Embeds documents and queries for the vector index.

judge:
  openai:
    model: openai/gpt-4.1
    file: backend/evaluator.py
    constant: JUDGE_MODELS[0]
    provider: OpenRouter
    auth: OPENROUTER_API_KEY
    purpose: OpenAI-family judge for Faithfulness and Answer Relevance, routed through OpenRouter as part of the three-judge panel.

  google:
    model: google/gemini-2.5-flash
    file: backend/evaluator.py
    constant: JUDGE_MODELS[1]
    provider: OpenRouter
    auth: OPENROUTER_API_KEY
    purpose: Google-family judge for Faithfulness and Answer Relevance, routed through OpenRouter for cross-model comparison. Uses a flash-tier model because it returns explicit text answers cleanly on the binary chat-completions judge path.

  anthropic:
    model: anthropic/claude-sonnet-4.5
    file: backend/evaluator.py
    constant: JUDGE_MODELS[2]
    provider: OpenRouter
    auth: OPENROUTER_API_KEY
    purpose: Anthropic-family judge for Faithfulness and Answer Relevance, routed through OpenRouter as the third panel member.

  claim_decomposition:
    model: openai/gpt-4.1-mini
    file: backend/evaluator.py
    constant: CLAIM_DECOMPOSITION_MODEL
    provider: OpenRouter
    auth: OPENROUTER_API_KEY
    purpose: Shared claim decomposition model used before the three judges verify support claim-by-claim.
